version: 2

updates:
  - package-ecosystem: npm
    directory: /digilegacy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Tauri packages move together; separate PRs produce unresolvable peer conflicts.
      tauri:
        patterns:
          - "@tauri-apps/*"
      test-tooling:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vue-tsc"
          - "typescript"
    ignore:
      # Node engine constraint is pinned in package.json engines; major bumps need a manual Node baseline update.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /digilegacy/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
