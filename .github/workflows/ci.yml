name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · typecheck / test+coverage / build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # 依赖链要求 ^22.22.2 || ^24.15.0 || >=26；22 线在 Actions 上会解析到最新 22.x，
          # 本地实测 24.14.0 反而不满足，故固定 22 线（LTS + 满足 engines）。
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 单元测试 + 覆盖率门禁
        run: npm run test:coverage

      - name: 生产构建
        run: npm run build

      - name: 依赖漏洞扫描（npm）
        # 默认镜像的 audit 端点常不可用，显式指向官方 registry
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  e2e:
    name: E2E · Playwright（7 个视图交互链路）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        # GitHub runner 的 CDN 速度正常；显式给足超时，避免大包下载被默认阈值截断
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npx playwright test

      - name: E2E 覆盖率（不阻断，仅报告）
        # 与单元覆盖率是两套口径：前者证明「用户点到的路径都跑过」，
        # 后者证明「分支组合被覆盖」。这里只产出报告，不设阈值。
        run: |
          rm -rf e2e/.coverage
          E2E_COVERAGE=1 npx playwright test
          node e2e/collect-coverage.mjs
        continue-on-error: true

      - name: 上传 E2E 覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: digilegacy/coverage-e2e/
          retention-days: 7

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: digilegacy/playwright-report/
          retention-days: 7

  rust:
    name: Rust · fmt / clippy / test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy/src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: digilegacy/src-tauri

      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --locked

      - name: 依赖漏洞扫描（RustSec）
        # 只对「漏洞」判定失败；unmaintained/unsound 属信息级警告，
        # 由 Tauri 上游依赖链决定，不应阻断本项目构建。
        run: |
          cargo install cargo-audit --locked --quiet || true
          cargo audit --deny vulnerabilities

  heartbeat-server:
    name: 心跳服务器 · 语法与行为
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy/server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: 语法检查
        run: node --check heartbeat-server.mjs

      - name: 启动并验证 /heartbeat 与 /check
        run: |
          HEARTBEAT_PORT=18080 node heartbeat-server.mjs &
          SERVER_PID=$!
          # 等待端口就绪（最多 10 秒）
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:18080/check && break
            sleep 0.5
          done
          echo "--- 上报一次心跳 ---"
          curl -sf -X POST http://127.0.0.1:18080/heartbeat \
            -H 'Content-Type: application/json' \
            -d '{"token":"ci-token"}' | tee /tmp/hb.json
          grep -q '"ok":true' /tmp/hb.json
          echo "--- 拒绝非法请求 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/heartbeat -d '{}')
          test "$code" = "400"
          echo "--- 查询检查端点 ---"
          curl -sf http://127.0.0.1:18080/check | tee /tmp/check.json
          kill $SERVER_PID
