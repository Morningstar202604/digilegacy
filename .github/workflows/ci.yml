name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · typecheck / test+coverage / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 单元测试 + 覆盖率门禁
        run: npm run test:coverage

      - name: 生产构建
        run: npm run build

  rust:
    name: Rust · fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digilegacy/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: digilegacy/src-tauri

      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --locked

  heartbeat-server:
    name: 心跳服务器 · 语法与行为
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digilegacy/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: node --check heartbeat-server.mjs

      - name: 启动并验证 /heartbeat 与 /check
        run: |
          HEARTBEAT_PORT=18080 node heartbeat-server.mjs &
          SERVER_PID=$!
          # 等待端口就绪（最多 10 秒）
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:18080/check && break
            sleep 0.5
          done
          echo "--- 上报一次心跳 ---"
          curl -sf -X POST http://127.0.0.1:18080/heartbeat \
            -H 'Content-Type: application/json' \
            -d '{"token":"ci-token"}' | tee /tmp/hb.json
          grep -q '"ok":true' /tmp/hb.json
          echo "--- 拒绝非法请求 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/heartbeat -d '{}')
          test "$code" = "400"
          echo "--- 查询检查端点 ---"
          curl -sf http://127.0.0.1:18080/check | tee /tmp/check.json
          kill $SERVER_PID
